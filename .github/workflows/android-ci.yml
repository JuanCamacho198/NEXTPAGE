name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

# Concurrency: cancel superseded runs on the same PR/branch.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 keeps history for release-mapping / version checks.
          fetch-depth: 0

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Remote build cache + config cache reuse cut the cold JVM/config
          # tax; the gradle User Home cache makes dependency + Robolectric
          # jars survive between runs.
          cache-read-only: false
          add-job-summary: 'on-failure'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            android/.gradle
          # Cache invalidation keys: wrapper bump + root + app build files.
          # Touching any of them forces a fresh dependency cache.
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/build.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Robolectric android-all jars
        # Robolectric downloads ~100MB of android-all jars on a cold runner;
        # pin them per Robolectric version so focused unit tests stay warm.
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric/android
          key: ${{ runner.os }}-robolectric-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Make gradlew executable
        # No-op on the Linux runner, but defensive: if a contributor ever
        # commits gradlew without the executable bit, this step restores it
        # rather than failing the job with a confusing permission error.
        working-directory: android
        run: chmod +x ./gradlew || true

      - name: Run focused tests + detekt
        working-directory: android
        # Linux runner: the daemon is fine (the --no-daemon prescription was
        # for the local Windows pwsh/Gradle VFS hang; an ephemeral runner just
        # pays a cold JVM start for nothing). Configuration cache + build
        # cache remove the remaining per-run reconfiguration/rebuild tax.
        #
        # Focused test scope: `com.nextpage.debug.*` + `ReleaseFormatTest`
        # only (per orchestrator preflight). Full suite stays a verify-phase
        # concern to keep CI fast.
        run: |
          ./gradlew \
            --configuration-cache \
            --build-cache \
            -Dorg.gradle.vfs.watch=false \
            :app:testDebugUnitTest \
            --tests "com.nextpage.debug.*" \
            --tests "com.nextpage.ReleaseFormatTest" \
            detekt
