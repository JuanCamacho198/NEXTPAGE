name: Android CI

on:
  # Allow maintainers to re-run the full gate manually from the Actions tab.
  workflow_dispatch:
  # No `branches` filter on purpose: chained PRs target intermediate branches,
  # not `main`, and a `branches: [main]` filter silently skipped CI for every
  # slice of a feature-branch-chain. Branch protection only requires this check
  # on `main`, so running it on PRs to any base is safe.
  # No `paths-ignore` on this trigger, on purpose. Branch protection requires
  # the `Android checks` job on `main`; with a trigger-level path filter a
  # desktop/web/packages-only PR never started this workflow, so the required
  # check never reported and the PR stayed permanently BLOCKED. The path
  # filtering now lives inside the job (`Detect Android-relevant changes`): the
  # job always runs and always reports, while the heavy Android steps below run
  # only when Android-relevant paths actually changed.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

# Concurrency: cancel superseded runs on the same PR/branch.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Android checks
    runs-on: ubuntu-latest
    # Full unit suite (~1117 tests) + detekt + verification gates. Locally the
    # full debug suite ran in ~5m12s on Windows; ubuntu runners are comparable
    # but a cold-cache first run is slower, so leave generous headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 keeps history for release-mapping / version checks,
          # and lets the relevance check diff base..head by SHA below.
          fetch-depth: 0

      - name: Detect Android-relevant changes
        # This step exists so the `Android checks` job always RUNS on a pull
        # request and always REPORTS a conclusion, which is what branch
        # protection requires. The alternative — filtering paths on the
        # `pull_request` trigger — skipped the workflow entirely for
        # desktop-only PRs, so the required check never appeared and the PR was
        # unmergeable. A non-relevant PR now reports a fast, successful no-op
        # instead of paying for the full Android suite.
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push/workflow_dispatch: never a required-check context, so always
            # do the real work.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" \
            | grep -qE '^(android/|\.github/workflows/android-ci\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No Android-relevant changes in this PR; reporting success as a no-op."
          fi

      - name: Setup Java (Temurin 17)
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: steps.changes.outputs.relevant == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          # Remote build cache + config cache reuse cut the cold JVM/config
          # tax; the gradle User Home cache makes dependency + Robolectric
          # jars survive between runs.
          cache-read-only: false
          add-job-summary: 'on-failure'

      - name: Make gradlew executable
        if: steps.changes.outputs.relevant == 'true'
        # No-op on the Linux runner, but defensive: if a contributor ever
        # commits gradlew without the executable bit, this step restores it
        # rather than failing the job with a confusing permission error.
        working-directory: android
        run: chmod +x ./gradlew || true

      - name: Run unit tests, detekt and verification gates
        if: steps.changes.outputs.relevant == 'true'
        working-directory: android
        # Linux runner: the daemon is fine (the --no-daemon prescription was
        # for the local Windows pwsh/Gradle VFS hang; an ephemeral runner just
        # pays a cold JVM start for nothing). Configuration cache + build
        # cache remove the remaining per-run reconfiguration/rebuild tax.
        #
        # Full unit suite (all ~1117 tests, no --tests filter). Instrumentation
        # tests are intentionally out of scope — no emulator job (deferred).
        # The verify* tasks below are the cheap, deterministic string/source
        # gates. verifyReleaseMapping and verifySentryMappingUpload are
        # release-only (R8 mapping / SENTRY_AUTH_TOKEN) and stay out of CI.
        run: |
          ./gradlew \
            --configuration-cache \
            --build-cache \
            -Dorg.gradle.vfs.watch=false \
            :app:testDebugUnitTest \
            detekt \
            spotlessCheck \
            :app:lintDebug \
            :app:verifyStringParity \
            :app:verifyAuthScreenNoHardcodedStrings \
            :app:verifyNoReaderUiStateResidue \
            :app:koverXmlReportDebug \
            :app:koverHtmlReportDebug

      - name: Upload Kover coverage reports
        # Report-only: coverage is published as an artifact and never gates the
        # test result (Kover's `verify` block is deliberately absent; a coverage
        # bound is deferred). A MISSING report, however, is a real failure —
        # `if-no-files-found: error` turns a silently skipped report into a red
        # step. `if: always()` keeps the report available even when an earlier
        # gate failed, since the tests that produce it already ran.
        # The relevance guard matters: on a no-op PR no report exists, and
        # `if-no-files-found: error` would turn that into a false failure.
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: kover-coverage
          path: |
            android/app/build/reports/kover/reportDebug.xml
            android/app/build/reports/kover/htmlDebug/
          if-no-files-found: error

      - name: Print failed test reports
        if: failure() && steps.changes.outputs.relevant == 'true'
        working-directory: android
        # The Gradle console only shows the failing test name; the XML report
        # carries the expected/actual message needed to diagnose without SSH.
        run: |
          grep -rl "<failure\|<error" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | while read -r f; do
            echo "===== $f ====="
            grep -A5 '<failure\|<error' "$f" | head -40
          done
