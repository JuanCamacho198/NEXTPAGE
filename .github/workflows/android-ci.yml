name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

# Concurrency: cancel superseded runs on the same PR/branch.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 keeps history for release-mapping / version checks.
          fetch-depth: 0

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            android/.gradle
          # Cache invalidation keys: wrapper bump + root + app build files.
          # Touching any of them forces a fresh dependency cache.
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/build.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        # No-op on the Linux runner, but defensive: if a contributor ever
        # commits gradlew without the executable bit, this step restores it
        # rather than failing the job with a confusing permission error.
        working-directory: android
        run: chmod +x ./gradlew || true

      - name: Run focused tests + detekt
        working-directory: android
        # AGENTS.md gradle deadlock prescription: `--no-daemon` +
        # `-Dorg.gradle.vfs.watch=false` avoids the pwsh/Gradle VFS
        # interaction observed locally. Recovery if a runner still hangs:
        # `./gradlew --stop` then `taskkill /F /IM java.exe` (Windows only).
        #
        # Focused test scope: `com.nextpage.debug.*` + `ReleaseFormatTest`
        # only (per orchestrator preflight). Full suite stays a verify-phase
        # concern to keep CI fast.
        run: |
          ./gradlew --no-daemon -Dorg.gradle.vfs.watch=false \
            :app:testDebugUnitTest \
            --tests "com.nextpage.debug.*" \
            --tests "com.nextpage.ReleaseFormatTest" \
            detekt
