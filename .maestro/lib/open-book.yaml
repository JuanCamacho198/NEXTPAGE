# Shared subflow: open a book from Estanteria (shelf) and land in the reader.
# Param: BOOK_TITLE (exact Spanish title shown on the shelf card).
# Precondition: the flow is already on the Estanteria tab.
# Note: tapping the shelf card opens the book DETAIL screen first; the reader
# is entered through "Continuar leyendo" (tapped only when visible).
appId: com.nextpage
---
- assertVisible: Estantería
- tapOn: ${BOOK_TITLE}
- runFlow:
    when:
      visible: "Continuar leyendo"
    commands:
      - tapOn: "Continuar leyendo"
- waitForAnimationToEnd:
    timeout: 15000
