# Robolectric global configuration.
#
# Pin the emulated Android SDK to 34 (Android U). Robolectric 4.13 ships
# android-all shadows up to API 34; the app's compileSdk/targetSdk is 36, so
# without this pin the runner aborts every test whose target SDK exceeds
# Robolectric's max supported SDK with an `initializationError`.
#
# The readium mapper/preference tests hit this because they use
# RobolectricTestRunner without a per-class @Config; the six suites that
# already ran (e.g. AddonDaoTest, AppDatabaseMigrationTest) carry
# @Config(sdk = [34]) explicitly. Setting the default here makes the whole
# suite green without touching individual test assertions.
sdk=34
