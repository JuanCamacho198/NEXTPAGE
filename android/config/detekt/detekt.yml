# Detekt configuration for NextPage Android
# https://detekt.dev/docs/rules/
# Generated baseline: not used yet

config:
  validation: true

complexity:
  CyclomaticComplexMethod:
    threshold: 15
  TooManyFunctions:
    thresholdInInterfaces: 10
    thresholdInClasses: 15

formatting:
  Indentation:
    active: true
    indentSize: 4
  MaximumLineLength:
    active: true
    maxLineLength: 150

style:
  MagicNumber:
    active: true
    ignoreNumbers: [-1, 0, 1, 2, 100, 1000]
    ignoreHashCodeFunction: true
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.coroutines.*'
