[package]
name = "nextpage-desktop"
version = "0.1.0"
description = "NextPage desktop shell"
authors = ["juancho998"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde", "clock"] }
regex = "1.13.1"
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
thiserror = "1.0.69"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "8.6.0"
epub = "2.1"
lopdf = "0.44.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
